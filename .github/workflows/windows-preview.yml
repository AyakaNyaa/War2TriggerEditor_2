name: Windows preview

on:
  push:
    paths:
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency: windows-preview

env:
  RELEASE_TAG: v0.3.0-preview.2

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Build frontend
        run: |
          npm.cmd ci --prefix apps/frontend --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run build --prefix apps/frontend
      - name: Build Windows applications
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.98.1 build --workspace --locked
      - name: Package Windows preview
        run: python tools/package_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: builds/War2TriggerEditor-preview.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep -Fxq 'War2TriggerEditor-preview.zip'; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" War2TriggerEditor-preview.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'War2 Trigger Editor 0.3.0 Preview 2' \
            --notes 'Windows x64 preview. Extract the ZIP and run War2TriggerEditor.exe. Requires Microsoft Edge WebView2 Runtime.'
